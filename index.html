<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1720">
  <title>Megye tanuló játék</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
  <header class="site-header">
    <h1>🗺️ Megye tanuló játék <span class="badge" id="badge"></span></h1>
    <div class="score">Pontszám: <span id="score">0</span></div>
    <div class="header-actions">
      <button class="button secondary" id="menuBtn">Menü</button>
      <button class="button secondary" id="restart">Újrakezdés</button>
    </div>
  </header>
  <section id="menuScreen" class="menu-screen" aria-label="Játékmódok">
    <div class="menu-group"><h2>Megye tanulás</h2><button class="mode-button" data-mode="county-easy"><b>Könnyített</b><span>A jó válasz azonnal a helyére kerül.</span></button><button class="mode-button" data-mode="county-hard"><b>Nehezített</b><span>Mindent el kell helyezni, majd egyszerre ellenőrizni.</span></button></div>
    <div class="menu-group"><h2>Megyeszékhely tanulás</h2><button class="mode-button" data-mode="seat-easy"><b>Könnyített</b><span>A megye nevek látszanak, a jó válasz azonnal a helyére kerül.</span></button><button class="mode-button" data-mode="seat-medium"><b>Nehezített</b><span>A megye nevek nem látszanak, a jó válasz azonnal a helyére kerül.</span></button><button class="mode-button" data-mode="seat-extreme"><b>Extrém</b><span>A megye nevek nem látszanak, majd egyszerre kell ellenőrizni.</span></button></div>
  </section>
  <section id="gameScreen" hidden>
    <div class="instructions" id="instructions"></div>
    <main class="game-layout"><div class="map-wrap" id="mapWrap"><div class="zoom-layer" id="zoomLayer"><svg class="map" id="map" viewBox="0 0 1000 613" aria-label="Magyarország megyéi"></svg></div><div class="zoom-controls" aria-label="Térkép nagyítása"><button class="zoom-control" id="zoomOut" type="button" aria-label="Kicsinyítés">−</button><button class="zoom-control" id="zoomIn" type="button" aria-label="Nagyítás">+</button></div><button class="zoom-button" id="zoomReset" hidden type="button">100%</button></div><aside class="tray"><h2 id="trayTitle">Megyék</h2><div id="trayItems"></div><div class="check-wrap"><button class="button" id="check" hidden>Ellenőrzés</button></div></aside></main>
  </section>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><button class="button" id="next">Tovább</button></div></div>
  <script src="reset.js"></script><script src="viewport.js"></script><script src="layout.js"></script><script src="zoom.js"></script><script src="feedback.js"></script><script type="module" src="app.js"></script>
</body>
</html>
