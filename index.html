<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Megye tanuló játék</title>
<style>
:root{--bg:#0e1720;--panel:#1b2937;--tray:#223443;--line:#0b121a;--text:#f2f6f8;--muted:#a0b1be;--accent:#2fa56f;--ok:#1e7a4d;--bad:#8b302b;--dot:#eb6557;--sel:#ffd166}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:clamp(8px,2vw,14px) clamp(10px,3vw,20px);background:var(--panel);border-bottom:2px solid #081017;flex-wrap:wrap}
h1{font-size:clamp(1rem,3.4vw,1.25rem);margin:0}
.badge{font-size:clamp(.68rem,2vw,.78rem);background:#df5b50;border-radius:12px;padding:3px 10px;margin-left:6px;white-space:nowrap}
.score{color:var(--muted);font-size:clamp(.8rem,2.4vw,1rem)}
button{border:0;border-radius:7px;background:var(--accent);color:white;font-weight:650;font-size:clamp(.82rem,2.2vw,.95rem);padding:clamp(7px,1.8vw,9px) clamp(10px,3vw,16px);cursor:pointer}
button:hover{filter:brightness(1.08)}button.secondary{background:#425769}button:disabled{opacity:.5;cursor:not-allowed}
.instructions{max-width:1480px;margin:clamp(8px,2vw,16px) auto 0;padding:clamp(10px,2.5vw,14px) clamp(10px,3vw,16px);background:var(--panel);border-radius:10px;color:var(--muted);line-height:1.45;font-size:clamp(.82rem,2.2vw,.92rem)}
.instructions b{color:var(--text)}
main{max-width:1500px;margin:auto;padding:clamp(8px,2vw,16px);display:flex;gap:clamp(8px,2vw,16px);align-items:flex-start;flex-wrap:wrap}
.map-wrap{flex:1 1 660px;min-width:280px;position:relative;background:#0b141c;border-radius:10px;overflow:hidden;aspect-ratio:1000/613;touch-action:none}
#zoomLayer{position:absolute;inset:0;transform-origin:0 0}
svg{display:block;width:100%;height:100%;background:#172532}
.region{fill:#2b4052;stroke:var(--line);stroke-width:1.4;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}
.region:hover{fill:#3a5266}.region.correct{fill:#226847;stroke:#62dca0}.region.correct:hover{fill:#226847}.region.fixed{fill:#294b3b;cursor:default}.region.fixed:hover{fill:#294b3b}.region.wrong{fill:var(--bad)}
.zoom-btn{position:absolute;top:8px;right:8px;z-index:40;background:#1b2937cc;border:1px solid #405768;color:var(--text);border-radius:8px;padding:6px 10px;font-size:.8rem;cursor:pointer}
.tray{flex:0 1 290px;min-width:220px;min-height:300px;max-height:80vh;overflow:auto;padding:clamp(8px,2vw,14px);background:var(--panel);border-radius:10px}
.tray h2{font-size:clamp(.85rem,2.4vw,1rem);margin:0 0 8px;color:var(--muted)}
.chip{display:inline-block;margin:clamp(3px,.8vw,5px);padding:clamp(5px,1.6vw,9px) clamp(8px,2.6vw,14px);border-radius:18px;border:2px solid #405768;background:var(--tray);font-size:clamp(.72rem,2.4vw,.9rem);user-select:none;cursor:pointer;transition:transform .1s,border-color .1s,box-shadow .1s;white-space:nowrap}
.chip:hover{border-color:#5c7488}
.chip.selected{border-color:var(--sel);box-shadow:0 0 0 3px rgba(255,209,102,.3)}
.chip.placed{position:absolute;z-index:30;transform:translate(-50%,-50%)}
.chip.placed.selected{box-shadow:0 0 0 3px rgba(255,209,102,.45)}
.chip.locked{background:var(--ok);pointer-events:none;cursor:default}
.check-wrap{text-align:center;margin-top:12px}
.seat-dot{fill:var(--dot);stroke:#fff;stroke-width:1.2;cursor:pointer}.seat-dot.correct{fill:#2fa56f}.seat-dot.wrong{fill:var(--bad)}
.county-label{font-size:9px;fill:#b1bec8;text-anchor:middle;pointer-events:none}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000b;z-index:100}.overlay.show{display:flex}
.dialog{background:var(--panel);border-radius:12px;max-width:440px;width:90%;padding:clamp(20px,5vw,28px) clamp(20px,6vw,35px);text-align:center}.dialog h2{margin-top:0}
#menuScreen{max-width:900px;margin:clamp(14px,4vw,30px) auto;padding:0 clamp(10px,3vw,16px)}
.menu-group{background:var(--panel);border-radius:12px;padding:clamp(14px,3vw,20px) clamp(16px,4vw,24px);margin-bottom:18px}
.menu-group h2{margin-top:0;font-size:clamp(1rem,3vw,1.1rem)}
.mode-btn{display:block;width:100%;text-align:left;background:var(--tray);border:2px solid #405768;border-radius:10px;padding:clamp(10px,3vw,14px) clamp(12px,3.5vw,18px);margin-bottom:10px;color:var(--text);cursor:pointer;transition:border-color .15s,background .15s}
.mode-btn:hover{border-color:var(--accent);background:#28394a}
.mode-btn b{display:block;font-size:clamp(.9rem,2.6vw,1rem);margin-bottom:4px}
.mode-btn span{color:var(--muted);font-size:clamp(.78rem,2.2vw,.87rem)}
@media(max-width:600px){header{justify-content:center;text-align:center}main{flex-direction:column}.tray{flex-basis:auto;width:100%;max-height:260px}}
</style>
</head>
<body>
<header>
  <h1>🗺️ Megye tanuló játék <span class="badge" id="badge"></span></h1>
  <div class="score">Pontszám: <span id="score">0</span></div>
  <div><button class="secondary" id="menuBtn">Menü</button> <button class="secondary" id="restart">Újrakezdés</button></div>
</header>

<div id="menuScreen">
  <div class="menu-group">
    <h2>Megye tanulás</h2>
    <button class="mode-btn" data-mode="county-easy"><b>Könnyített</b><span>A jó válasz azonnal a helyére kerül.</span></button>
    <button class="mode-btn" data-mode="county-hard"><b>Nehezített</b><span>Mindent el kell helyezni, majd ellenőrizni kell egyszerre.</span></button>
  </div>
  <div class="menu-group">
    <h2>Megyeszékhely tanulás</h2>
    <button class="mode-btn" data-mode="seat-easy"><b>Könnyített</b><span>A megye nevek látszanak, a jó válasz azonnal a helyére kerül.</span></button>
    <button class="mode-btn" data-mode="seat-medium"><b>Nehezített</b><span>A megye nevek nem látszanak, a jó válasz azonnal a helyére kerül.</span></button>
    <button class="mode-btn" data-mode="seat-extreme"><b>Extrém</b><span>A megye nevek nem látszanak, mindent el kell helyezni, majd ellenőrizni kell egyszerre.</span></button>
  </div>
</div>

<div id="gameScreen" hidden>
  <div class="instructions" id="instructions"></div>
  <main>
    <div class="map-wrap" id="mapWrap">
      <div id="zoomLayer"><svg id="map" viewBox="0 0 1000 613" aria-label="Magyarország megyéi"></svg></div>
      <button class="zoom-btn" id="zoomReset" hidden>100%</button>
    </div>
    <aside class="tray"><h2 id="trayTitle">Megyék</h2><div id="trayItems"></div><div class="check-wrap"><button id="check" hidden>Ellenőrzés</button></div></aside>
  </main>
</div>

<div class="overlay" id="overlay"><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><button id="next">Tovább</button></div></div>

const V_W=1000,V_H=613,collator=new Intl.Collator('hu');

};

let state={mode:null,score:0,placements:{}};
let selectedChip=null;
let zoom={scale:1,x:0,y:0};
let pinch=null;

function esc(s){return String(s).replace(/["\\]/g,'\\$&');}

/* ---------- pinch-to-zoom / pan (two-finger only, single-finger tap untouched) ---------- */
function applyZoom(){
  zoomLayer.style.transform = 'translate('+zoom.x+'px,'+zoom.y+'px) scale('+zoom.scale+')';
  document.querySelectorAll('.chip.placed').forEach(c=>{
    c.style.transform = 'translate(-50%,-50%) scale('+(1/zoom.scale)+')';
  });
  $('#zoomReset').hidden = zoom.scale <= 1.02;
}

function clampZoom(){
  const cw = mapWrap.clientWidth, ch = mapWrap.clientHeight;
  const contentW = cw*zoom.scale, contentH = ch*zoom.scale;
  const minX = Math.min(0, cw-contentW), minY = Math.min(0, ch-contentH);
  zoom.x = Math.max(minX, Math.min(0, zoom.x));
  zoom.y = Math.max(minY, Math.min(0, zoom.y));
}

function resetZoom(){
  zoom = {scale:1,x:0,y:0};
  applyZoom();
}

function touchDist(t0,t1){ return Math.hypot(t1.clientX-t0.clientX, t1.clientY-t0.clientY); }
function touchMidRel(t0,t1){
  const r = mapWrap.getBoundingClientRect();
  return {x:(t0.clientX+t1.clientX)/2 - r.left, y:(t0.clientY+t1.clientY)/2 - r.top};
}

mapWrap.addEventListener('touchstart', (e)=>{
  if(e.touches.length===2){
    e.preventDefault();
    const d0 = touchDist(e.touches[0], e.touches[1]);
    const mid0 = touchMidRel(e.touches[0], e.touches[1]);
    pinch = {
      d0, scale0: zoom.scale,
      anchor: { x:(mid0.x - zoom.x)/zoom.scale, y:(mid0.y - zoom.y)/zoom.scale }
    };
  }
}, {passive:false});

mapWrap.addEventListener('touchmove', (e)=>{
  if(pinch && e.touches.length===2){
    e.preventDefault();
    const d1 = touchDist(e.touches[0], e.touches[1]);
    const mid1 = touchMidRel(e.touches[0], e.touches[1]);
    const newScale = Math.max(1, Math.min(4, pinch.scale0 * (d1/pinch.d0)));
    zoom.scale = newScale;
    zoom.x = mid1.x - pinch.anchor.x*newScale;
    zoom.y = mid1.y - pinch.anchor.y*newScale;
    clampZoom();
    applyZoom();
  }
}, {passive:false});

mapWrap.addEventListener('touchend', (e)=>{
  if(e.touches.length<2) pinch=null;
});
mapWrap.addEventListener('touchcancel', ()=>{ pinch=null; });

$('#zoomReset').addEventListener('click', resetZoom);

/* ---------- map + game logic ---------- */
function buildMap(){
  svg.innerHTML='';
  for(const c of COUNTIES){
    const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    p.setAttribute('points', c.points);
    p.setAttribute('class', 'region');
    p.dataset.id = c.id;
    p.addEventListener('click', ()=>onRegionClick(c));
    svg.appendChild(p);
  }
}

function placeAt(chip, xy){
  chip.style.left = (xy[0]/V_W*100)+'%';
  chip.style.top = (xy[1]/V_H*100)+'%';
  chip.style.transform = 'translate(-50%,-50%) scale('+(1/zoom.scale)+')';
}

function insertSorted(chip){
  const kids=[...tray.children];
  const t=chip.textContent;
  const before = kids.find(k=>collator.compare(t, k.textContent)<0);
  if(before) tray.insertBefore(chip, before);
  else tray.appendChild(chip);
}

function returnTray(chip){
  chip.classList.remove('placed','selected');
  chip.style.left=''; chip.style.top=''; chip.style.transform='';
  delete chip._pending;
  insertSorted(chip);
}

function clearSelection(){
  if(selectedChip){ selectedChip.classList.remove('selected'); selectedChip=null; }
}

function selectChip(chip){
  if(chip.classList.contains('locked')) return;
  if(selectedChip === chip){ clearSelection(); return; }
  clearSelection();
  selectedChip = chip;
  chip.classList.add('selected');
}

function lockCounty(chip, c){
  chip.classList.remove('selected');
  chip.classList.add('locked','placed');
  if(!zoomLayer.contains(chip)) zoomLayer.appendChild(chip);
  placeAt(chip, c.labelPos);
  svg.querySelector('polygon[data-id="'+esc(c.id)+'"]').classList.add('correct');
  state.placements[c.id]=true;
}

function lockSeat(chip, c){
  chip.classList.remove('selected');
  chip.classList.add('locked','placed');
  if(!zoomLayer.contains(chip)) zoomLayer.appendChild(chip);
  placeAt(chip, c.seatPos);
  svg.querySelector('circle[data-seat="'+esc(c.seat)+'"]').classList.add('correct');
}

function flash(id){
  const p=svg.querySelector('polygon[data-id="'+esc(id)+'"]');
  if(!p) return;
  p.classList.add('wrong');
  setTimeout(()=>p.classList.remove('wrong'), 350);
}

function placeTentative(chip, xy, pendingId){
  chip.classList.remove('selected');
  chip.classList.add('placed');
  if(!zoomLayer.contains(chip)) zoomLayer.appendChild(chip);
  placeAt(chip, xy);
  chip._pending = pendingId;
}

function onRegionClick(c){
  if(!selectedChip) return;
  const mode = MODES[state.mode];
  if(mode.group !== 'county') return;
  const chip = selectedChip;
  const d = chip._data;
  if(!mode.check){
    if(c.id === d.id){
      lockCounty(chip, c);
      state.score+=10; $('#score').textContent=state.score;
      selectedChip=null;
      complete();
    } else {
      flash(c.id);
    }
  } else {
    placeTentative(chip, c.labelPos, c.id);
    selectedChip=null;
  }
}

function onSeatClick(c){
  if(!selectedChip) return;
  const mode = MODES[state.mode];
  if(mode.group !== 'seat') return;
  const chip = selectedChip;
  const d = chip._data;
  if(!mode.check){
    if(c.seat === d.id){
      lockSeat(chip, c);
      state.score+=10; $('#score').textContent=state.score;
      selectedChip=null;
      complete();
    } else {
      const dot=svg.querySelector('circle[data-seat="'+esc(c.seat)+'"]');
      if(dot){ dot.classList.add('wrong'); setTimeout(()=>dot.classList.remove('wrong'),350); }
    }
  } else {
    placeTentative(chip, c.seatPos, c.seat);
    selectedChip=null;
  }
}

function addChip(text, data){
  const x=document.createElement('div');
  x.className='chip';
  x.textContent=text;
  x._data = data;
  x.addEventListener('click', (e)=>{ e.stopPropagation(); selectChip(x); });
  tray.appendChild(x);
}

function allCounties(){ return COUNTIES.every(c=>state.placements[c.id]); }
function allSeats(){
  return COUNTIES.filter(c=>c.seat).every(c=>{
    const dot = svg.querySelector('circle[data-seat="'+esc(c.seat)+'"]');
    return dot && dot.classList.contains('correct');
  });
}

function popup(title, text, next){
  $('#dialogTitle').textContent = title;
  $('#dialogText').textContent = text;
  $('#overlay').classList.add('show');
  $('#next').onclick = ()=>{ $('#overlay').classList.remove('show'); next(); };
}

function complete(){
  const mode = MODES[state.mode];
  if(mode.group==='county' && allCounties()){
    setTimeout(()=>popup('Gratulálok! 🎉','Minden megyét elhelyeztél! Pontszám: '+state.score, showMenu), 250);
  } else if(mode.group==='seat' && allSeats()){
    setTimeout(()=>popup('Gratulálok! 🎉','Minden megyeszékhelyet elhelyeztél! Pontszám: '+state.score, showMenu), 250);
  }
}

function startMode(modeKey){
  const mode = MODES[modeKey];
  state.mode = modeKey;
  state.score = 0;
  state.placements = {};
  selectedChip = null;
  resetZoom();
  $('#score').textContent = 0;
  document.querySelectorAll('.chip').forEach(x=>x.remove());
  tray.innerHTML='';
  buildMap();
  $('#check').hidden = !mode.check;

  if(mode.group==='county'){
    $('#trayTitle').textContent='Megyék';
    const sorted=[...COUNTIES].sort((a,b)=>collator.compare(a.id,b.id));
    for(const c of sorted){ addChip(c.id, {id:c.id}); }
  } else {
    $('#trayTitle').textContent='Megyeszékhelyek';
    for(const c of COUNTIES){
      svg.querySelector('polygon[data-id="'+esc(c.id)+'"]').classList.add('fixed');
      if(mode.showLabels){
        const t=document.createElementNS('http://www.w3.org/2000/svg','text');
        t.setAttribute('x', c.labelPos[0]);
        t.setAttribute('y', c.labelPos[1]);
        t.setAttribute('class', 'county-label');
        t.textContent = c.id;
        svg.appendChild(t);
      }
      if(c.seatPos){
        const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
        dot.setAttribute('cx', c.seatPos[0]);
        dot.setAttribute('cy', c.seatPos[1]);
        dot.setAttribute('r', 7.5);
        dot.setAttribute('class', 'seat-dot');
        dot.dataset.seat = c.seat;
        dot.addEventListener('click', ()=>onSeatClick(c));
        svg.appendChild(dot);
      }
    }
    const seatList = COUNTIES.filter(c=>c.seat).map(c=>c.seat).sort((a,b)=>collator.compare(a,b));
    for(const s of seatList){ addChip(s, {id:s}); }
  }

  $('#instructions').innerHTML = '<b>'+mode.title+'</b><br>'+mode.text;
  $('#badge').textContent = mode.badge;
  $('#menuScreen').hidden = true;
  $('#gameScreen').hidden = false;
}

function showMenu(){
  $('#overlay').classList.remove('show');
  $('#gameScreen').hidden = true;
  $('#menuScreen').hidden = false;
  $('#badge').textContent = '';
}

$('#check').onclick = ()=>{
  const chips = [...document.querySelectorAll('.chip.placed:not(.locked)')];
  const mode = MODES[state.mode];
  for(const chip of chips){
    const d = chip._data;
    if(mode.group==='county'){
      if(chip._pending === d.id){
        const c = COUNTIES.find(x=>x.id===d.id);
        lockCounty(chip, c);
        state.score += 10;
      } else {
        setTimeout(()=>returnTray(chip), 200);
      }
    } else {
      if(chip._pending === d.id){
        const c = COUNTIES.find(x=>x.seat===d.id);
        lockSeat(chip, c);
        state.score += 10;
      } else {
        setTimeout(()=>returnTray(chip), 200);
      }
    }
  }
  $('#score').textContent = state.score;
  setTimeout(complete, 300);
};

zoomLayer.addEventListener('click', (e)=>{
  const tag = e.target.tagName ? e.target.tagName.toLowerCase() : '';
  if((tag==='svg' || e.target===zoomLayer) && selectedChip && selectedChip.classList.contains('placed')){
    returnTray(selectedChip);
    selectedChip = null;
  }
});

$('#restart').onclick = ()=>{ if(state.mode) startMode(state.mode); };
$('#menuBtn').onclick = showMenu;
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>startMode(btn.dataset.mode));
});

showMenu();

</script>
</body>
</html>
